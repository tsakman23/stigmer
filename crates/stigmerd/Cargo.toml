[package]
name = "stigmerd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
stigmer-api = { path = "../stigmer-api", version = "0.0.0" }
stigmer-core = { path = "../stigmer-core", version = "0.0.0" }
stigmer-store = { path = "../stigmer-store", version = "0.0.0" }
stigmer-store-sqlite = { path = "../stigmer-store-sqlite", version = "0.0.0" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "stigmerd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
# HTTP/1.1 only: no http2 (or server-auto, which implies it) so no HTTP/2 path exists (ADR 0010).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server", "tokio", "http1", "service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
stigmer-api = { path = "../stigmer-api", version = "0.0.0" }
stigmer-core = { path = "../stigmer-core", version = "0.0.0" }
stigmer-store = { path = "../stigmer-store", version = "0.0.0" }
stigmer-store-sqlite = { path = "../stigmer-store-sqlite", version = "0.0.0" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
# tls12 exists only so the test client can attempt TLS 1.2 and see the server refuse it; the
# server itself is built and configured for TLS 1.3 only.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"

[package]
name = "stigmerd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "http1", "http2", "service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
stigmer-api = { path = "../stigmer-api", version = "0.0.0" }
stigmer-core = { path = "../stigmer-core", version = "0.0.0" }
stigmer-store = { path = "../stigmer-store", version = "0.0.0" }
stigmer-store-sqlite = { path = "../stigmer-store-sqlite", version = "0.0.0" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"

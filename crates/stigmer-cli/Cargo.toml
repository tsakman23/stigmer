[package]
name = "stigmer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "stigmer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.9", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stigmer-core = { path = "../stigmer-core", version = "0.0.0" }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
axum = "0.8.9"
stigmer-api = { path = "../stigmer-api", version = "0.0.0" }
stigmer-store-sqlite = { path = "../stigmer-store-sqlite", version = "0.0.0" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }

name: Feature request
description: Suggest something Stigmer should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap (docs/roadmap.md) first: the feature may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you would like it to work. A command line or an example is enough.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered or work around it today.

name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The commands you ran, in order. Remove any tokens or invites.
      render: sh
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output or error message, and the exit code if there was one.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: A release tag (for example v0.2.0) or a commit hash.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - local mode
        - network mode
        - not sure
  - type: input
    id: platform
    attributes:
      label: Operating system
      description: For example macOS 15 or Ubuntu 24.04.
